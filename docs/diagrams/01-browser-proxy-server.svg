<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1390" viewBox="0 0 1500 1390" role="img"><title>01-browser-proxy-server</title><rect width="100%" height="100%" fill="white"/>
<text x="48" y="49.0" font-family="Arial, sans-serif" font-size="30" fill="#172b4d" font-weight="700">01 · Browser → Proxy → Stream Server</text>
<text x="48" y="85.0" font-family="Arial, sans-serif" font-size="19" fill="#627086" font-weight="400">ESTADO ATUAL · comandos server / proxy · HTTP sem proteção criptográfica</text>
<rect x="48" y="120" width="330" height="113.19999999999999" rx="10" fill="#f0f7ff" stroke="#176bba" stroke-width="1.5"/>
<text x="66" y="150.0" font-family="Arial, sans-serif" font-size="19" fill="#176bba" font-weight="700">BROWSER</text>
<text x="66" y="181.0" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">O teu navegador</text>
<text x="66" y="207.6" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">Tempo: de cima para baixo</text>
<rect x="420" y="120" width="490" height="113.19999999999999" rx="10" fill="#f0f7ff" stroke="#176bba" stroke-width="1.5"/>
<text x="438" y="150.0" font-family="Arial, sans-serif" font-size="19" fill="#176bba" font-weight="700">PROXY · :8080</text>
<text x="438" y="181.0" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">ProxySocketServer.run()</text>
<text x="438" y="207.6" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">Tempo: de cima para baixo</text>
<rect x="952" y="120" width="500" height="113.19999999999999" rx="10" fill="#f0f7ff" stroke="#176bba" stroke-width="1.5"/>
<text x="970" y="150.0" font-family="Arial, sans-serif" font-size="19" fill="#176bba" font-weight="700">STREAM SERVER · :8081</text>
<text x="970" y="181.0" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">StreamServer.run()</text>
<text x="970" y="207.6" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">Tempo: de cima para baixo</text>
<rect x="420" y="280" width="490" height="135.6" rx="10" fill="#f0f7ff" stroke="#176bba" stroke-width="1.5"/>
<text x="438" y="310.0" font-family="Arial, sans-serif" font-size="18" fill="#176bba" font-weight="700">0 · Arranque do proxy</text>
<text x="438" y="341.0" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">main() → ProxySocketServer.run()</text>
<text x="438" y="366.2" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">ServerSocket(8080).accept()</text>
<text x="438" y="391.4" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">pool.submit { handle(...) }</text>
<rect x="952" y="280" width="500" height="135.6" rx="10" fill="#f0f7ff" stroke="#176bba" stroke-width="1.5"/>
<text x="970" y="310.0" font-family="Arial, sans-serif" font-size="18" fill="#176bba" font-weight="700">0 · Arranque do servidor</text>
<text x="970" y="341.0" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">main() → StreamServer.run()</text>
<text x="970" y="366.2" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">Valida a diretoria media/</text>
<text x="970" y="391.4" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">ServerSocket(8081).accept() → handle()</text>
<text x="48" y="495.0" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" font-weight="400">1 · Abres localhost:8080</text>
<path d="M80,535 L650,535" fill="none" stroke="#176bba" stroke-width="2"/>
<polyline points="640.0950818741205,539.7846208752235 650,535 640.0950818741205,530.2153791247765" fill="none" stroke="#176bba" stroke-width="2"/>
<text x="92" y="522.0" font-family="Arial, sans-serif" font-size="18" fill="#176bba" font-weight="700">GET /</text>
<rect x="420" y="565" width="490" height="135.6" rx="10" fill="#f0f7ff" stroke="#176bba" stroke-width="1.5"/>
<text x="438" y="595.0" font-family="Arial, sans-serif" font-size="18" fill="#176bba" font-weight="700">ProxySocketServer.handle()</text>
<text x="438" y="626.0" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">HttpUtil.readLine(): pedido + headers</text>
<text x="438" y="651.2" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">Rota / → servePage(out)</text>
<text x="438" y="676.4" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">Escreve headers HTTP + INDEX_HTML</text>
<path d="M650,735 L80,735" fill="none" stroke="#176bba" stroke-width="2"/>
<polyline points="89.90491812587945,730.2153791247765 80,735 89.90491812587945,739.7846208752235" fill="none" stroke="#176bba" stroke-width="2"/>
<text x="92" y="722.0" font-family="Arial, sans-serif" font-size="18" fill="#176bba" font-weight="700">200 OK + HTML</text>
<text x="48" y="775.0" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">2 · A página pede o catálogo</text>
<path d="M80,820 L650,820" fill="none" stroke="#176bba" stroke-width="2"/>
<polyline points="640.0950818741205,824.7846208752235 650,820 640.0950818741205,815.2153791247765" fill="none" stroke="#176bba" stroke-width="2"/>
<text x="92" y="807.0" font-family="Arial, sans-serif" font-size="18" fill="#176bba" font-weight="700">GET /catalog</text>
<path d="M650,875 L1200,875" fill="none" stroke="#176bba" stroke-width="2"/>
<polyline points="1190.0950818741205,879.7846208752235 1200,875 1190.0950818741205,870.2153791247765" fill="none" stroke="#176bba" stroke-width="2"/>
<text x="662" y="862.0" font-family="Arial, sans-serif" font-size="18" fill="#176bba" font-weight="700">relayResponse() → GET /catalog</text>
<rect x="952" y="905" width="500" height="135.6" rx="10" fill="#f0f7ff" stroke="#176bba" stroke-width="1.5"/>
<text x="970" y="935.0" font-family="Arial, sans-serif" font-size="18" fill="#176bba" font-weight="700">StreamServer.handle()</text>
<text x="970" y="966.0" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">serveCatalog() → Files.list(media/)</text>
<text x="970" y="991.2" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">HttpUtil.encodeName() → lista de nomes</text>
<text x="970" y="1016.4" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" font-weight="400">writeHeaders() + corpo da resposta</text>
<path d="M1200,1080 L650,1080" fill="none" stroke="#176bba" stroke-width="2"/>
<polyline points="659.9049181258795,1075.2153791247765 650,1080 659.9049181258795,1084.7846208752235" fill="none" stroke="#176bba" stroke-width="2"/>
<text x="662" y="1067.0" font-family="Arial, sans-serif" font-size="18" fill="#176bba" font-weight="700">200 OK + catálogo</text>
<path d="M650,1125 L80,1125" fill="none" stroke="#176bba" stroke-width="2"/>
<polyline points="89.90491812587945,1120.2153791247765 80,1125 89.90491812587945,1129.7846208752235" fill="none" stroke="#176bba" stroke-width="2"/>
<text x="92" y="1112.0" font-family="Arial, sans-serif" font-size="18" fill="#176bba" font-weight="700">relayResponse() → lista para o browser</text>
<rect x="48" y="1170" width="1404" height="170" rx="10" fill="#fff8eb" stroke="#d3a458" stroke-width="1.5"/>
<text x="70" y="1202.0" font-family="Arial, sans-serif" font-size="22" fill="#a35c00" font-weight="700">3 · Ao selecionar / reproduzir um vídeo</text>
<text x="70" y="1238.0" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">Browser: GET /video/nome.mp4 [+ Range] → ProxySocketServer.handle()</text>
<text x="70" y="1264.6" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">Proxy: relayFromOrigin() → relayResponse() → GET /media/nome.mp4 [+ Range]</text>
<text x="70" y="1291.2" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">Servidor: handle() → serveFile() → writeHeaders() → RandomAccessFile.read() em blocos de 1024 bytes</text>
<text x="70" y="1317.8" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" font-weight="400">Regresso: 200/206 + MP4 → proxy lê e reencaminha → browser descodifica e reproduz</text>
</svg>